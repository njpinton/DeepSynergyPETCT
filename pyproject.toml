[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsynergy"
version = "2.0.0"
description = "Synergistic PET/CT reconstruction with multi-branch generative priors"
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.23.5,<2.0",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "opencv-python-headless>=4.5,<5",
    "matplotlib>=3.7",
    "tensorflow~=2.15.1",
]

[project.optional-dependencies]
astra = ["astra-toolbox>=2.2"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["deepsynergy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
